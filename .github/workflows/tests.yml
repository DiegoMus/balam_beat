# Rama serial: solo corre las pruebas.
# (GitHub Pages publica la rama main, que es la versión MIDI.)
name: Pruebas

on:
  push:
    branches: [serial]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test.mjs
